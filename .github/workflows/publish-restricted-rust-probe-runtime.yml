name: Publish restricted Rust probe runtime

on:
  workflow_dispatch:
    inputs:
      bundle-id:
        description: Reviewed entry in runtime/rust-cargo/bundles.json
        required: true
        type: string

permissions:
  contents: read

env:
  RUST_BUILDX_VERSION: v0.37.1
  RUST_BUILDX_LINUX_AMD64_SHA256: sha256:9447199cdb435f25880548343c128a4b6650e8891ee598905d8d29d39a8e359b
  RUST_BUILDX_ASSET_URL: https://github.com/docker/buildx/releases/download/v0.37.1/buildx-v0.37.1.linux-amd64
  RUST_BUILDKIT_VERSION: v0.33.0
  RUST_BUILDKIT_IMAGE: moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
  RUST_SBOM_GENERATOR: docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
  RUST_SBOM_GENERATOR_LINUX_AMD64_DIGEST: sha256:187e1892a7752c9384c59aba9517dd8e40610b748c72773e87b63720514463c2
  RUST_TOOLCHAIN_BASE_IMAGE: rust:1.95-bookworm@sha256:6258907abe69656e41cd992e0b705cdcfabcbbe3db374f92ed2d47121282d4a1
  RUST_TOOLCHAIN_BASE_LINUX_AMD64_DIGEST: sha256:4c2fd73ef19c5ef9d54bee03b06b2839a392604fbfcd578ed948b71b37c1d7fb
  RUST_PYTHON_BASE_IMAGE: python:3.11.16-bookworm@sha256:b99029c95d3d37fb1e4e76d287f7984373dca77c665885986e31b2c95260c13c
  RUST_PYTHON_BASE_LINUX_AMD64_DIGEST: sha256:00f0ecbf74ff8f915020d5a40c4bc6a83f46cd7b83f47db51c7e204f0d8a3ec2

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.PRIVATE_FORKS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Resolve reviewed runtime bundle
        id: bundle
        shell: bash
        env:
          BUNDLE_ID: ${{ inputs.bundle-id }}
        run: |
          set -euo pipefail
          python scripts/rust_runtime_bundle.py "$BUNDLE_ID" \
            --catalog runtime/rust-cargo/bundles.json \
            --github-output "$GITHUB_OUTPUT" >/dev/null
      - name: Check out exact probe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ${{ steps.bundle.outputs.repository }}
          ref: ${{ steps.bundle.outputs.revision }}
          path: .rust-runtime-target
          persist-credentials: false
      - name: Verify reviewed probe inputs
        shell: bash
        env:
          BUNDLE_ID: ${{ inputs.bundle-id }}
          EXPECTED_REVISION: ${{ steps.bundle.outputs.revision }}
        run: >-
          test "$(git -C .rust-runtime-target rev-parse HEAD)" = "$EXPECTED_REVISION"
          && python scripts/rust_runtime_bundle.py "$BUNDLE_ID"
          --catalog runtime/rust-cargo/bundles.json --target .rust-runtime-target
      - name: Require existing private runtime package
        shell: bash
        env:
          RUST_RUNTIME_PACKAGE_METADATA_TOKEN: ${{ secrets.RUST_RUNTIME_PACKAGE_METADATA_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/rust-runtime-private-evidence" "$RUNNER_TEMP/rust-runtime-public-receipt"
          python scripts/rust_runtime_registry.py check-private-package --output "$RUNNER_TEMP/rust-runtime-private-evidence/package-before.json"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
      - name: Check reviewed source fetch context without credentials
        shell: bash
        env:
          BUNDLE_ID: ${{ inputs.bundle-id }}
        run: python scripts/rust_runtime_source_fetch.py check --bundle-id "$BUNDLE_ID"
      - name: Fetch locked private dependencies without compiling target code
        shell: bash
        env:
          BUNDLE_ID: ${{ inputs.bundle-id }}
          PRIVATE_FORKS_READ_TOKEN: ${{ secrets.PRIVATE_FORKS_READ_TOKEN }}
        run: python scripts/rust_runtime_source_fetch.py fetch --bundle-id "$BUNDLE_ID"
      - name: Build and publish content-addressed runtime
        id: publish
        shell: bash
        env:
          BUNDLE_ID: ${{ steps.bundle.outputs.bundle_id }}
          PROBE_REPOSITORY: ${{ steps.bundle.outputs.repository }}
          PROBE_REVISION: ${{ steps.bundle.outputs.revision }}
          MANIFEST_PATH: ${{ steps.bundle.outputs.manifest_path }}
          MANIFEST_SHA256: ${{ steps.bundle.outputs.manifest_sha256 }}
          LOCK_PATH: ${{ steps.bundle.outputs.lock_path }}
          LOCK_SHA256: ${{ steps.bundle.outputs.lock_sha256 }}
          SUBJECT_PATH: ${{ steps.bundle.outputs.subject_path }}
          SUBJECT_SHA256: ${{ steps.bundle.outputs.subject_sha256 }}
          GHCR_TOKEN: ${{ secrets.RUST_RUNTIME_PACKAGE_WRITE_TOKEN }}
          GHCR_USERNAME: ${{ secrets.RUST_RUNTIME_PACKAGE_USERNAME }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/rust-runtime-private-evidence"
          auth_config="$(mktemp -d "$RUNNER_TEMP/rust-runtime-auth.XXXXXX")"
          anonymous_config="$(mktemp -d "$RUNNER_TEMP/rust-runtime-anonymous.XXXXXX")"
          buildx_path="$auth_config/cli-plugins/docker-buildx"
          builder_name="rust-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="ghcr.io/elevenid/feature-regression-rust-cargo-restricted:${BUNDLE_ID}-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          buildx_verified=0
          image_digest=""
          cleanup() {
            if [[ "$buildx_verified" = 1 ]]; then
              DOCKER_CONFIG="$auth_config" docker buildx rm --force "$builder_name" >/dev/null 2>&1 || true
              DOCKER_CONFIG="$auth_config" docker logout ghcr.io >/dev/null 2>&1 || true
            fi
            if [[ -n "$image_digest" ]]; then
              docker image rm --force "$image_digest" >/dev/null 2>&1 || true
            fi
            docker image rm --force "$image" >/dev/null 2>&1 || true
            rm -rf -- "$auth_config" "$anonymous_config"
          }
          trap cleanup EXIT
          mkdir -p "$artifact_dir" "$(dirname "$buildx_path")"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --location --fail --silent --show-error \
            "$RUST_BUILDX_ASSET_URL" --output "$buildx_path"
          buildx_sha256="sha256:$(sha256sum "$buildx_path" | cut -d' ' -f1)"
          test "$buildx_sha256" = "$RUST_BUILDX_LINUX_AMD64_SHA256"
          chmod 0555 "$buildx_path"
          buildx_verified=1
          jq -cnS --arg version "$RUST_BUILDX_VERSION" \
            --arg sha256 "$buildx_sha256" \
            --arg asset "buildx-v0.37.1.linux-amd64" \
            '{asset:$asset,platform:"linux/amd64",sha256:$sha256,version:$version}' \
            > "$artifact_dir/buildx-identity.json"
          export DOCKER_CONFIG="$auth_config"
          docker buildx version | tee "$artifact_dir/buildx-version.txt"
          grep -F " $RUST_BUILDX_VERSION " "$artifact_dir/buildx-version.txt" >/dev/null
          selected_buildx_path="$(docker info --format '{{json .ClientInfo.Plugins}}' \
            | jq -er '[.[] | select(.Name == "buildx")] | if length == 1 then .[0].Path else error("ambiguous buildx plugin") end')"
          test "$(realpath "$selected_buildx_path")" = "$(realpath "$buildx_path")"
          docker buildx create --name "$builder_name" --driver docker-container \
            --driver-opt "image=$RUST_BUILDKIT_IMAGE" --use >/dev/null
          docker buildx inspect --bootstrap | tee "$artifact_dir/buildkit-inspect.txt"
          grep -F "$RUST_BUILDKIT_VERSION" "$artifact_dir/buildkit-inspect.txt" >/dev/null
          builder_container="buildx_buildkit_${builder_name}0"
          docker inspect --format \
            '{"configured_image":{{json .Config.Image}},"image_id":{{json .Image}}}' \
            "$builder_container" > "$artifact_dir/buildkit-container.json"
          buildkit_image_id="$(jq -er '.image_id | select(test("^sha256:[0-9a-f]{64}$"))' \
            "$artifact_dir/buildkit-container.json")"
          docker image inspect --format \
            '{"image_id":{{json .Id}},"repo_digests":{{json .RepoDigests}}}' \
            "$buildkit_image_id" > "$artifact_dir/buildkit-image.json"
          docker buildx imagetools inspect "$RUST_SBOM_GENERATOR" \
            --format '{{json .Manifest}}' > "$artifact_dir/sbom-generator-index.json"
          docker buildx imagetools inspect "$RUST_TOOLCHAIN_BASE_IMAGE" \
            --format '{{json .Manifest}}' > "$artifact_dir/rust-base-index.json"
          docker buildx imagetools inspect "$RUST_PYTHON_BASE_IMAGE" \
            --format '{{json .Manifest}}' > "$artifact_dir/python-base-index.json"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          docker buildx build --pull --push --provenance=mode=max,version=v1 \
            --sbom="generator=$RUST_SBOM_GENERATOR" \
            --platform linux/amd64 \
            --file runtime/rust-cargo/Dockerfile.restricted \
            --build-arg "PROBE_MANIFEST_PATH=$MANIFEST_PATH" \
            --build-arg "PROBE_LOCK_PATH=$LOCK_PATH" \
            --build-arg "PROBE_REPOSITORY=$PROBE_REPOSITORY" \
            --build-arg "PROBE_REVISION=$PROBE_REVISION" \
            --build-arg "PROBE_MANIFEST_SHA256=$MANIFEST_SHA256" \
            --build-arg "PROBE_LOCK_SHA256=$LOCK_SHA256" \
            --build-arg "PROBE_SUBJECT_PATH=$SUBJECT_PATH" \
            --build-arg "PROBE_SUBJECT_SHA256=$SUBJECT_SHA256" \
            --build-arg "BUILDX_VERSION=$RUST_BUILDX_VERSION" \
            --build-arg "BUILDX_SHA256=$RUST_BUILDX_LINUX_AMD64_SHA256" \
            --build-arg "BUILDKIT_IMAGE=$RUST_BUILDKIT_IMAGE" \
            --build-arg "SBOM_GENERATOR=$RUST_SBOM_GENERATOR" \
            --build-arg "SBOM_GENERATOR_LINUX_AMD64_DIGEST=$RUST_SBOM_GENERATOR_LINUX_AMD64_DIGEST" \
            --build-arg "PYTHON_BASE_IMAGE=$RUST_PYTHON_BASE_IMAGE" \
            --build-arg "PYTHON_BASE_LINUX_AMD64_DIGEST=$RUST_PYTHON_BASE_LINUX_AMD64_DIGEST" \
            --metadata-file "$artifact_dir/build-metadata.json" \
            --tag "$image" .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' \
            "$artifact_dir/build-metadata.json")"
          image_digest="ghcr.io/elevenid/feature-regression-rust-cargo-restricted@${digest}"
          docker buildx imagetools inspect "$image_digest" --raw \
            > "$artifact_dir/image-index.json"
          docker buildx imagetools inspect "$image_digest" --format '{{json .Provenance}}' \
            > "$artifact_dir/provenance.json"
          docker buildx imagetools inspect "$image_digest" --format '{{json .SBOM}}' \
            > "$artifact_dir/sbom.json"
          docker pull "$image_digest"
          runtime_manifest="$(docker run --rm --pull=never --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges --ipc=none \
            --pids-limit=32 --memory=64m --memory-swap=64m --cpus=.25 \
            --user=65534:65534 \
            "$image_digest" /bin/cat /opt/elevenid/runtime-manifest.json)"
          test "$runtime_manifest" = "$(jq -cS . <<<"$runtime_manifest")"
          printf '%s' "$runtime_manifest" > "$artifact_dir/runtime-manifest.json"
          test "sha256:$(sha256sum "$buildx_path" | cut -d' ' -f1)" \
            = "$RUST_BUILDX_LINUX_AMD64_SHA256"
          docker image inspect --format '{{json .RepoDigests}}' "$image_digest" \
            | jq -e --arg image "$image_digest" 'index($image) != null' >/dev/null
          docker image inspect --format '{{json .Config.Labels}}' "$image_digest" > "$artifact_dir/labels.json"
          printf 'image=%s\n' "$image_digest" >> "$GITHUB_OUTPUT"
      - name: Verify runtime package remained private
        shell: bash
        env:
          RUST_RUNTIME_PACKAGE_METADATA_TOKEN: ${{ secrets.RUST_RUNTIME_PACKAGE_METADATA_TOKEN }}
        run: python scripts/rust_runtime_registry.py check-private-package --output "$RUNNER_TEMP/rust-runtime-private-evidence/package-after.json"
      - name: Validate private runtime provenance before storing raw evidence
        shell: bash
        env:
          BUNDLE_ID: ${{ inputs.bundle-id }}
          RUNTIME_IMAGE: ${{ steps.publish.outputs.image }}
        run: >-
          python scripts/rust_runtime_publication.py --restricted
          --catalog runtime/rust-cargo/bundles.json --bundle-id "$BUNDLE_ID"
          --evidence-dir "$RUNNER_TEMP/rust-runtime-private-evidence"
          --image "$RUNTIME_IMAGE" --publisher-revision "$GITHUB_SHA"
          --output "$RUNNER_TEMP/restricted-runtime-prepublication.json"
      - name: Store raw publication evidence only in the private package
        id: evidence
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.RUST_RUNTIME_PACKAGE_WRITE_TOKEN }}
          GHCR_USERNAME: ${{ secrets.RUST_RUNTIME_PACKAGE_USERNAME }}
          BUNDLE_ID: ${{ inputs.bundle-id }}
          RUNTIME_IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          set -euo pipefail
          auth_config="$(mktemp -d "$RUNNER_TEMP/rust-evidence-auth.XXXXXX")"
          builder_name="rust-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          buildx_verified=0
          evidence_container="rust-evidence-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evidence_image=""
          cleanup() {
            docker rm --force "$evidence_container" >/dev/null 2>&1 || true
            if [[ "$buildx_verified" = 1 ]]; then
              DOCKER_CONFIG="$auth_config" docker buildx rm --force "$builder_name" >/dev/null 2>&1 || true
            fi
            if [[ -n "$evidence_image" ]]; then docker image rm "$evidence_image" >/dev/null 2>&1 || true; fi
            DOCKER_CONFIG="$auth_config" docker logout ghcr.io >/dev/null 2>&1 || true
            rm -rf -- "$auth_config"
          }
          trap cleanup EXIT
          mkdir -p "$auth_config/cli-plugins"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --location --fail --silent --show-error "$RUST_BUILDX_ASSET_URL" --output "$auth_config/cli-plugins/docker-buildx"
          test "sha256:$(sha256sum "$auth_config/cli-plugins/docker-buildx" | cut -d' ' -f1)" = "$RUST_BUILDX_LINUX_AMD64_SHA256"
          chmod 0555 "$auth_config/cli-plugins/docker-buildx"
          buildx_verified=1
          export DOCKER_CONFIG="$auth_config"
          docker buildx create --name "$builder_name" --driver docker-container --driver-opt "image=$RUST_BUILDKIT_IMAGE" --use >/dev/null
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          docker buildx build --push --provenance=false --sbom=false --platform linux/amd64 \
            --file runtime/rust-cargo/Dockerfile.evidence \
            --metadata-file "$RUNNER_TEMP/rust-evidence-image.json" \
            --tag "ghcr.io/elevenid/feature-regression-rust-cargo-restricted:evidence-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/rust-runtime-private-evidence"
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/rust-evidence-image.json")"
          evidence_image="ghcr.io/elevenid/feature-regression-rust-cargo-restricted@${digest}"
          docker pull "$evidence_image"
          docker image inspect --format '{{json .RepoDigests}}' "$evidence_image" | jq -e --arg image "$evidence_image" 'index($image) != null' >/dev/null
          docker create --name "$evidence_container" --network none --read-only --cap-drop ALL --security-opt no-new-privileges "$evidence_image" /never-execute >/dev/null
          mkdir "$RUNNER_TEMP/rust-runtime-evidence-replay"
          docker cp "$evidence_container:/evidence" "$RUNNER_TEMP/rust-runtime-evidence-replay/"
          python scripts/rust_runtime_publication.py --restricted \
            --catalog runtime/rust-cargo/bundles.json --bundle-id "$BUNDLE_ID" \
            --evidence-dir "$RUNNER_TEMP/rust-runtime-evidence-replay/evidence" \
            --image "$RUNTIME_IMAGE" --publisher-revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/restricted-runtime-replayed.json"
          cmp "$RUNNER_TEMP/restricted-runtime-prepublication.json" "$RUNNER_TEMP/restricted-runtime-replayed.json"
          printf 'image=%s\n' "$evidence_image" >> "$GITHUB_OUTPUT"
      - name: Verify evidence package remained private
        shell: bash
        env:
          RUST_RUNTIME_PACKAGE_METADATA_TOKEN: ${{ secrets.RUST_RUNTIME_PACKAGE_METADATA_TOKEN }}
        run: python scripts/rust_runtime_registry.py check-private-package --output "$RUNNER_TEMP/rust-runtime-public-receipt/package-evidence-after.json"
      - name: Bind the private evidence image into sanitized publication receipt
        shell: bash
        env:
          BUNDLE_ID: ${{ inputs.bundle-id }}
          RUNTIME_IMAGE: ${{ steps.publish.outputs.image }}
          EVIDENCE_IMAGE: ${{ steps.evidence.outputs.image }}
        run: >-
          python scripts/rust_runtime_publication.py --restricted
          --catalog runtime/rust-cargo/bundles.json --bundle-id "$BUNDLE_ID"
          --evidence-dir "$RUNNER_TEMP/rust-runtime-private-evidence"
          --image "$RUNTIME_IMAGE" --publisher-revision "$GITHUB_SHA"
          --private-evidence-image "$EVIDENCE_IMAGE"
          --evidence-package-after "$RUNNER_TEMP/rust-runtime-public-receipt/package-evidence-after.json"
          --output "$RUNNER_TEMP/rust-runtime-public-receipt/publication.json"
      - name: Upload only sanitized restricted publication bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restricted-rust-runtime-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-runtime-public-receipt
          if-no-files-found: error
          retention-days: 90
      - name: Retire private source cache
        if: always()
        shell: bash
        run: python scripts/rust_runtime_source_fetch.py cleanup
