name: Publish Rust probe runtime

on:
  workflow_dispatch:
    inputs:
      bundle-id:
        description: Reviewed entry in runtime/rust-cargo/bundles.json
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  RUST_BUILDX_VERSION: v0.37.1
  RUST_BUILDKIT_VERSION: v0.33.0
  RUST_BUILDKIT_IMAGE: moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
  RUST_SBOM_GENERATOR: docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Resolve reviewed runtime bundle
        id: bundle
        shell: bash
        env:
          BUNDLE_ID: ${{ inputs.bundle-id }}
        run: |
          set -euo pipefail
          python scripts/rust_runtime_bundle.py "$BUNDLE_ID" \
            --catalog runtime/rust-cargo/bundles.json \
            --github-output "$GITHUB_OUTPUT" >/dev/null
      - name: Check out exact probe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ${{ steps.bundle.outputs.repository }}
          ref: ${{ steps.bundle.outputs.revision }}
          path: .rust-runtime-target
          persist-credentials: false
      - name: Verify reviewed probe inputs
        shell: bash
        env:
          BUNDLE_ID: ${{ inputs.bundle-id }}
          EXPECTED_REVISION: ${{ steps.bundle.outputs.revision }}
        run: >-
          test "$(git -C .rust-runtime-target rev-parse HEAD)" = "$EXPECTED_REVISION"
          && python scripts/rust_runtime_bundle.py "$BUNDLE_ID"
          --catalog runtime/rust-cargo/bundles.json --target .rust-runtime-target
      - name: Set up attested OCI builder
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/rust-runtime-auth-docker
        with:
          version: ${{ env.RUST_BUILDX_VERSION }}
          driver-opts: image=${{ env.RUST_BUILDKIT_IMAGE }}
      - name: Build and publish content-addressed runtime
        id: publish
        shell: bash
        env:
          BUNDLE_ID: ${{ steps.bundle.outputs.bundle_id }}
          PROBE_REPOSITORY: ${{ steps.bundle.outputs.repository }}
          PROBE_REVISION: ${{ steps.bundle.outputs.revision }}
          MANIFEST_PATH: ${{ steps.bundle.outputs.manifest_path }}
          MANIFEST_SHA256: ${{ steps.bundle.outputs.manifest_sha256 }}
          LOCK_PATH: ${{ steps.bundle.outputs.lock_path }}
          LOCK_SHA256: ${{ steps.bundle.outputs.lock_sha256 }}
          SUBJECT_PATH: ${{ steps.bundle.outputs.subject_path }}
          SUBJECT_SHA256: ${{ steps.bundle.outputs.subject_sha256 }}
          GHCR_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/rust-runtime-auth-docker
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/rust-runtime-publication"
          auth_config="$DOCKER_CONFIG"
          anonymous_config="$(mktemp -d "$RUNNER_TEMP/rust-runtime-anonymous.XXXXXX")"
          image="ghcr.io/elevenid/feature-regression-rust-cargo:${BUNDLE_ID}-${GITHUB_SHA}"
          image_digest=""
          cleanup() {
            DOCKER_CONFIG="$auth_config" docker logout ghcr.io >/dev/null 2>&1 || true
            if [[ -n "$image_digest" ]]; then
              docker image rm --force "$image_digest" >/dev/null 2>&1 || true
            fi
            docker image rm --force "$image" >/dev/null 2>&1 || true
            rm -rf -- "$anonymous_config"
          }
          trap cleanup EXIT
          mkdir -p "$artifact_dir"
          docker buildx version | tee "$artifact_dir/buildx-version.txt"
          grep -F " $RUST_BUILDX_VERSION " "$artifact_dir/buildx-version.txt" >/dev/null
          docker buildx inspect --bootstrap | tee "$artifact_dir/buildkit-inspect.txt"
          grep -F "$RUST_BUILDKIT_VERSION" "$artifact_dir/buildkit-inspect.txt" >/dev/null
          builder_container="buildx_buildkit_${BUILDER_NAME:?}0"
          docker inspect --format \
            '{"configured_image":{{json .Config.Image}},"image_id":{{json .Image}}}' \
            "$builder_container" > "$artifact_dir/buildkit-container.json"
          buildkit_image_id="$(jq -er '.image_id | select(test("^sha256:[0-9a-f]{64}$"))' \
            "$artifact_dir/buildkit-container.json")"
          docker image inspect --format \
            '{"image_id":{{json .Id}},"repo_digests":{{json .RepoDigests}}}' \
            "$buildkit_image_id" > "$artifact_dir/buildkit-image.json"
          export DOCKER_CONFIG="$auth_config"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker buildx build --pull --push --provenance=mode=max,version=v1 \
            --sbom="generator=$RUST_SBOM_GENERATOR" \
            --platform linux/amd64 \
            --file runtime/rust-cargo/Dockerfile \
            --build-arg "PROBE_MANIFEST_PATH=$MANIFEST_PATH" \
            --build-arg "PROBE_LOCK_PATH=$LOCK_PATH" \
            --build-arg "PROBE_REPOSITORY=$PROBE_REPOSITORY" \
            --build-arg "PROBE_REVISION=$PROBE_REVISION" \
            --build-arg "PROBE_MANIFEST_SHA256=$MANIFEST_SHA256" \
            --build-arg "PROBE_LOCK_SHA256=$LOCK_SHA256" \
            --build-arg "PROBE_SUBJECT_PATH=$SUBJECT_PATH" \
            --build-arg "PROBE_SUBJECT_SHA256=$SUBJECT_SHA256" \
            --build-arg "BUILDX_VERSION=$RUST_BUILDX_VERSION" \
            --build-arg "BUILDKIT_IMAGE=$RUST_BUILDKIT_IMAGE" \
            --build-arg "SBOM_GENERATOR=$RUST_SBOM_GENERATOR" \
            --metadata-file "$artifact_dir/build-metadata.json" \
            --tag "$image" .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' \
            "$artifact_dir/build-metadata.json")"
          image_digest="ghcr.io/elevenid/feature-regression-rust-cargo@${digest}"
          docker buildx imagetools inspect "$image_digest" --raw \
            > "$artifact_dir/image-index.json"
          docker buildx imagetools inspect "$image_digest" --format '{{json .Provenance}}' \
            > "$artifact_dir/provenance.json"
          docker buildx imagetools inspect "$image_digest" --format '{{json .SBOM}}' \
            > "$artifact_dir/sbom.json"
          docker pull "$image_digest"
          runtime_manifest="$(docker run --rm --pull=never --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges --ipc=none \
            --pids-limit=32 --memory=64m --memory-swap=64m --cpus=.25 \
            --user=65534:65534 \
            "$image_digest" /bin/cat /opt/elevenid/runtime-manifest.json)"
          test "$runtime_manifest" = "$(jq -cS . <<<"$runtime_manifest")"
          printf '%s' "$runtime_manifest" > "$artifact_dir/runtime-manifest.json"
          DOCKER_CONFIG="$auth_config" docker logout ghcr.io
          docker image rm --force "$image_digest" "$image" >/dev/null 2>&1 || true
          export DOCKER_CONFIG="$anonymous_config"
          if ! docker pull "$image_digest"; then
            echo "::error::GHCR package must be public before Rust runtime activation; set package visibility to public and rerun this publisher"
            exit 1
          fi
          docker image inspect --format '{{json .RepoDigests}}' "$image_digest" \
            | jq -e --arg image "$image_digest" 'index($image) != null' >/dev/null
          docker image inspect --format '{{json .Config.Labels}}' "$image_digest" \
            > "$artifact_dir/labels.json"
          anonymous_manifest="$(docker run --rm --pull=never --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges --ipc=none \
            --pids-limit=32 --memory=64m --memory-swap=64m --cpus=.25 \
            --user=65534:65534 \
            "$image_digest" /bin/cat /opt/elevenid/runtime-manifest.json)"
          test "$anonymous_manifest" = "$runtime_manifest"
          python -m scripts.rust_runtime_publication \
            --catalog runtime/rust-cargo/bundles.json \
            --bundle-id "$BUNDLE_ID" --evidence-dir "$artifact_dir" \
            --image "$image_digest" --publisher-revision "$GITHUB_SHA" \
            --output "$artifact_dir/publication.json"
          runtime_manifest_sha256="$(jq -er .runtime_manifest_sha256 \
            "$artifact_dir/publication.json")"
          printf 'image=%s\n' "$image_digest" >> "$GITHUB_OUTPUT"
          printf 'runtime_manifest_sha256=%s\n' "$runtime_manifest_sha256" >> "$GITHUB_OUTPUT"
          {
            echo '### Verified public Rust runtime'
            echo '```json'
            cat "$artifact_dir/publication.json"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload runtime publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-runtime-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-runtime-publication
          if-no-files-found: error
          retention-days: 90
