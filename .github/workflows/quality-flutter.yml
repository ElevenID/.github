name: Reusable Flutter quality

on:
  workflow_call:
    inputs:
      flutter-version:
        type: string
        required: true
      working-directory:
        type: string
        default: "."
      test-command:
        type: string
        default: "flutter test --coverage"
      build-command:
        description: Non-Apple debug build command
        type: string
        default: "flutter build web --debug"
      android-api-level:
        description: Android SDK platform installed when the build targets Android
        type: string
        default: "37"
      java-version:
        description: JDK used for Android SDK tools and Gradle
        type: string
        default: "21"
      native-rust-bridge:
        description: Build the reviewed Authenticator Rust bridge from locked source
        type: boolean
        default: false
    secrets:
      PRIVATE_FORKS_READ_TOKEN:
        description: Optional reader used only by the admitted native dependency fetch
        required: false

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: Flutter Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Validate native Rust owner
        if: inputs.native-rust-bridge
        shell: bash
        env:
          NATIVE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          test "$GITHUB_REPOSITORY" = "ElevenID/marty-authenticator"
          test "$NATIVE_WORKING_DIRECTORY" = "."
          printf '%s  %s\n' \
            '664270ad7727c87bac5d8314c57a98e59e14e97412fc2f73b0c8a8a510b0d62c' \
            '.github/scripts/private-forks.py' | sha256sum --check --status
      - name: Set up native Rust toolchain
        if: inputs.native-rust-bridge
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.97.1"
      - name: Set up native dependency helper runtime
        if: inputs.native-rust-bridge
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Require trusted native fork access
        if: vars.PRIVATE_FORKS_ENABLED == 'true' && inputs.native-rust-bridge
        shell: bash
        run: python .github/scripts/private-forks.py check
      - name: Fetch locked native fork dependencies
        if: vars.PRIVATE_FORKS_ENABLED == 'true' && inputs.native-rust-bridge
        shell: bash
        env:
          PRIVATE_FORKS_READ_TOKEN: ${{ secrets.PRIVATE_FORKS_READ_TOKEN }}
        run: python .github/scripts/private-forks.py fetch --manifest-path rust/Cargo.toml
      - name: Fetch locked public native dependencies
        if: vars.PRIVATE_FORKS_ENABLED != 'true' && inputs.native-rust-bridge
        shell: bash
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - name: Set up Android Java runtime
        if: contains(inputs.build-command, 'flutter build apk') || contains(inputs.build-command, 'flutter build appbundle')
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: stable
          cache: true
      - name: Select Android JDK for Flutter
        if: contains(inputs.build-command, 'flutter build apk') || contains(inputs.build-command, 'flutter build appbundle')
        shell: bash
        run: flutter config --jdk-dir "$JAVA_HOME"
      - name: Install Android SDK platform
        if: contains(inputs.build-command, 'flutter build apk') || contains(inputs.build-command, 'flutter build appbundle')
        shell: bash
        env:
          ANDROID_API_LEVEL: ${{ inputs.android-api-level }}
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f -perm -u+x | sort -V | tail -n 1)"
          fi
          test -n "$sdkmanager_path" && test -x "$sdkmanager_path"
          "$sdkmanager_path" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_API_LEVEL}.0.0"
      - name: Install locked dependencies
        shell: bash
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        shell: bash
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis
        shell: bash
        run: flutter analyze --fatal-infos
      - name: Tests and coverage
        shell: bash
        env:
          COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Enforce coverage
        shell: bash
        run: |
          awk -F: '
            $1 == "SF" {
              generated = ($2 ~ /\/l10n\/app_localizations(_[a-z]+)?\.dart$/ || $2 ~ /\.(g|freezed)\.dart$/ || $2 ~ /(^|\/)lib\/rust\/.*\.dart$/)
              if (generated) excluded_files++
            }
            !generated && $1 == "LF"  { lines_found += $2 }
            !generated && $1 == "LH"  { lines_hit += $2 }
            !generated && $1 == "BRF" { branches_found += $2 }
            !generated && $1 == "BRH" { branches_hit += $2 }
            END {
              if (lines_found == 0) {
                print "coverage/lcov.info contains no line coverage records" > "/dev/stderr"
                exit 2
              }

              printf "Excluded generated coverage files: %d\n", excluded_files
              line_rate = 100 * lines_hit / lines_found
              printf "Line coverage: %.2f%% (%d/%d); required: 90.00%%\n", line_rate, lines_hit, lines_found
              failed = line_rate + 0.000001 < 90

              if (branches_found > 0) {
                branch_rate = 100 * branches_hit / branches_found
                printf "Branch coverage: %.2f%% (%d/%d); required: 80.00%%\n", branch_rate, branches_hit, branches_found
                if (branch_rate + 0.000001 < 80) failed = 1
              } else {
                print "Branch coverage: unsupported (no BRF/BRH records emitted by Flutter)"
              }

              exit failed
            }
          ' coverage/lcov.info
      - name: Upload Flutter coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-coverage-${{ github.run_id }}
          path: ${{ inputs.working-directory }}/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
      - name: Non-Apple debug build
        shell: bash
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"
