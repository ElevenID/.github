name: Organization Quality

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cache-cleanup-tests:
    name: Cache cleanup action tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node --test actions/cleanup-ci-caches/cleanup.test.cjs

  local-evidence-tests:
    name: Local evidence retention tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test bounded evidence pruning
        run: python -m unittest discover -s tests -p test_prune_local_evidence.py -v

  workflow-quality:
    uses: ElevenID/.github/.github/workflows/quality-workflows.yml@c6dd7de55112abb53284dd0254f3a5914301a3ed
    with:
      policy-ref: c6dd7de55112abb53284dd0254f3a5914301a3ed

  dependency-review:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: ElevenID/.github/.github/workflows/dependency-review.yml@758fce1cd36f6f6bde12fed80921b86f19c2916b

  scorecard:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      security-events: write # Required to upload Scorecard SARIF.
      id-token: write # Required for keyless Scorecard result publishing.
      contents: read
    uses: ElevenID/.github/.github/workflows/scorecard.yml@758fce1cd36f6f6bde12fed80921b86f19c2916b
