name: Reusable Rust quality

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      test-command:
        type: string
        default: "cargo test --locked --workspace --all-targets"
      clippy-command:
        type: string
        default: "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"
      coverage-command:
        type: string
        default: "cargo llvm-cov --locked --workspace --all-features --fail-under-lines 90 --fail-under-branches 80"
      semver-check:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rust-quality-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust quality components
        shell: bash
        run: rustup component add clippy rustfmt llvm-tools-preview
      - name: Cache Rust dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ inputs.working-directory }}/target
          key: rust-quality-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/rust-toolchain', '**/rust-toolchain.toml') }}
      - name: Require a locked dependency graph
        shell: bash
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        env:
          COMMAND: ${{ inputs.clippy-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Tests
        shell: bash
        env:
          COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Restore pinned assurance tools
        id: assurance-tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-llvm-cov
          key: rust-assurance-tools-v1-${{ runner.os }}-${{ runner.arch }}-audit-0.22.2-deny-0.20.2-llvm-cov-0.8.7
      - name: Install pinned assurance tools
        if: ${{ steps.assurance-tools-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-llvm-cov --locked --version 0.8.7
      - name: RustSec audit
        shell: bash
        run: cargo audit
      - name: License and dependency policy
        shell: bash
        run: cargo deny check
      - name: Coverage
        shell: bash
        env:
          COMMAND: ${{ inputs.coverage-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Restore pinned SemVer checker
        if: inputs.semver-check
        id: semver-tool-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-semver-checks
          key: rust-semver-tool-v1-${{ runner.os }}-${{ runner.arch }}-0.48.0
      - name: Install SemVer checker
        if: inputs.semver-check
        shell: bash
        run: |
          if ! command -v cargo-semver-checks >/dev/null 2>&1; then
            cargo install cargo-semver-checks --locked --version 0.48.0
          fi
      - name: Public API compatibility
        if: inputs.semver-check
        shell: bash
        run: cargo semver-checks check-release
