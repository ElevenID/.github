name: Open-source policy audit
description: Enforce ElevenID public repository licensing, isolation, runner, and workflow policy
runs:
  using: composite
  steps:
    - name: Audit public repository policy
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check --only-binary=:all: "PyYAML==6.0.3"
        python "${{ github.action_path }}/audit.py" --repo-root "$GITHUB_WORKSPACE"
