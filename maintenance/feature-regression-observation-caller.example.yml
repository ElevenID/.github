name: feature-regression-observation-producer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  behavior-observations:
    uses: ElevenID/.github/.github/workflows/feature-regression-observation-producer.yml@eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    with:
      policy-ref: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      target-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      phase: ${{ github.event_name == 'pull_request' && 'after' || 'before' }}
      workflow-path: .github/workflows/behavior-observations.yml
      harness-path: .github/feature-regression/observation_harness.py
      harness-sha256: sha256:2fc9043d50adc119c390d1aec6a5de7c36d602d3a869d15cc30d807eb2bdfe69
      subject-path: .github/feature-regression/behavior_subject.py
      subject-sha256: sha256:68fe8ff29707f6344aec1bc4af06a8af38a54b7cac9b5794dde0aa2128fdcf64
      subject-runtime: python
      subject-args-json: '[]'
      subject-env-json: '{}'
      runtime-image: python:3.12-alpine@sha256:236173eb74001afe2f60862de935b74fcbd00adfca247b2c27051a70a6a39a2d
      job-name: behavior-observations / Behavior observation producer
      artifact-name-prefix: feature-regression-observations
      observation-path: feature-regression-observations.json
