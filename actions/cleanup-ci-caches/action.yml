name: Cleanup closed pull-request caches
description: Bounded, paced cleanup that preserves main and open pull-request caches
runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        CACHE_CLEANUP_ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const cleanup = require(process.env.CACHE_CLEANUP_ACTION_PATH + '/cleanup.cjs');
          await cleanup({github, context, core});
